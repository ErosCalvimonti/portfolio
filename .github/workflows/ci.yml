name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly, to catch external links that die

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pages are up to date with content.mjs
        run: npm run build && git diff --exit-code -- index.html es/index.html
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
